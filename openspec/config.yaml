schema: spec-driven

context: |
  Coding & Documentation Standards:
  - Add doc comments across main classes, data models, public methods, and interfaces.
  - Document class responsibilities, parameter contracts, calculation formulas, and state boundary conditions.
  - Update README.md and `docs/` for significant changes.
  Tech stack: 
  We use conventional commits
  Domain: 
  Platform: 
  Core Dependencies: 
  Testing: End-to-end and unit tests

rules:
  apply:
    tdd: true
  tasks:
    - Follow strict Test-Driven Development (TDD) and BDD ordering for all task lists.
    - List test creation tasks (failing tests) before corresponding implementation tasks for every component.
    - Structure phase tasks into 1. Unit/Integration test setup, 2. Feature implementation, 3. Refactoring.
